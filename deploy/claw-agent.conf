# Managed by deploy/pi-nginx.sh as /etc/nginx/sites-available/claw-agent.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/claw-agent;
    index index.html;
    # Chat uploads are sent one file at a time: 25 MiB plus multipart overhead.
    client_max_body_size 26m;

    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header Service-Worker-Allowed "/" always;
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location ~* \.(?:js|css|png|svg|ico|webmanifest|map)$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 240s;
    }

    location ^~ /files/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $http_host;
    }

    location ^~ /generated/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $http_host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Claw Agent 登录</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@300;400;500&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css?v=2">
  <link rel="stylesheet" href="/css/auth.css?v=1">
</head>
<body class="auth-body">
  <main class="auth-shell">
    <section class="auth-panel">
      <div class="brand-icon">⚡</div>
      <div class="auth-title">
        <span>Claw</span> Agent
      </div>
      <div class="auth-subtitle" id="authSubtitle">登录后继续使用工作台</div>

      <form class="auth-form" id="authForm">
        <label class="field-label">
          用户名
          <input class="skill-input" id="usernameInput" list="usernameOptions" autocomplete="username" />
          <datalist id="usernameOptions"></datalist>
        </label>
        <label class="field-label">
          密码
          <input class="skill-input" id="passwordInput" type="password" autocomplete="current-password" />
        </label>
        <label class="field-label" id="displayNameField" hidden>
          显示名称
          <input class="skill-input" id="displayNameInput" autocomplete="name" />
        </label>
        <label class="field-label" id="confirmPasswordField" hidden>
          确认密码
          <input class="skill-input" id="confirmPasswordInput" type="password" autocomplete="new-password" />
        </label>
        <div class="skill-form-error" id="authError"></div>
        <button class="modal-primary auth-submit" id="authSubmitBtn" type="submit">登录</button>
      </form>
    </section>
  </main>
  <script type="module" src="/js/login.js?v=1"></script>
</body>
</html>

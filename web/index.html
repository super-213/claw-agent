<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Claw Agent Web UI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@300;400;500&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css?v=2">

</head>
<body>
<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar" aria-label="历史对话">
    <div class="brand-area">
      <button class="sidebar-close" id="mobileSidebarClose" type="button" aria-label="关闭历史对话">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
      <div class="brand-icon">⚡</div>
      <div class="brand-name"><span>Claw</span> Agent</div>
      <div class="brand-tag">// Web Console v1.0</div>
    </div>
    <div class="sidebar-actions">
      <button class="new-btn" id="newSessionBtn">新建对话</button>
    </div>
    <div class="section-label">// Sessions</div>
    <div class="session-list" id="sessionList"></div>
    <div class="skill-panel">
      <div class="section-label">// Skills</div>
      <div class="skill-toolbar">
        <button class="skill-add-btn" id="addSkillBtn" type="button">添加技能</button>
        <button class="skill-reload-btn" id="reloadSkillsBtn" type="button" title="重载技能" aria-label="重载技能">↻</button>
      </div>
      <div class="skill-list" id="skillList"></div>
    </div>
    <div class="sidebar-footer">
      <div class="user-summary" id="userSummary">
        <span>当前用户</span>
        <strong>-</strong>
      </div>
      <div class="sidebar-action-grid" aria-label="账号操作">
        <button class="user-admin-btn" id="userAdminBtn" type="button" title="用户管理" hidden>用户</button>
        <a class="dashboard-btn" href="/dashboard" title="后台看板">看板</a>
        <button class="config-btn" id="configBtn" type="button" title="模型设置">模型</button>
        <button class="logout-btn" id="logoutBtn" type="button" title="退出登录">退出</button>
      </div>
      <div class="sys-status">
        <div class="dot"></div>
        <span>System Online</span>
      </div>
    </div>
  </aside>
  <div class="sidebar-backdrop" id="sidebarBackdrop" aria-hidden="true"></div>

  <!-- MAIN -->
  <main class="main">
    <div class="topbar">
      <div class="topbar-left">
        <button class="mobile-menu-btn" id="mobileMenuBtn" type="button" aria-label="打开历史对话" aria-controls="sidebar" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="4" y1="6" x2="20" y2="6"></line>
            <line x1="4" y1="12" x2="20" y2="12"></line>
            <line x1="4" y1="18" x2="20" y2="18"></line>
          </svg>
        </button>
        <div class="topbar-title" id="topbarTitle">新对话</div>
      </div>
      <div class="topbar-meta">
        <div class="meta-badge">
          <span id="tokenSummary">Tokens 0</span>
        </div>
        <div class="status-badge" id="statusBadge">
          <div class="dot"></div>
          <span id="statusText">就绪</span>
        </div>
        <button class="tree-toggle-btn" id="treePanelToggle" type="button" aria-label="切换分支树面板" aria-expanded="false" aria-controls="treePanel">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="4" r="2"></circle>
            <circle cx="6" cy="12" r="2"></circle>
            <circle cx="18" cy="12" r="2"></circle>
            <circle cx="6" cy="20" r="2"></circle>
            <circle cx="18" cy="20" r="2"></circle>
            <line x1="12" y1="6" x2="6" y2="10"></line>
            <line x1="12" y1="6" x2="18" y2="10"></line>
            <line x1="6" y1="14" x2="6" y2="18"></line>
            <line x1="18" y1="14" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>

    <div class="main-content">
      <div class="chat-area">
        <div class="chat-window" id="chatWindow">
          <div class="messages-wrap" id="messageList">
            <div class="empty-state" id="emptyState">
              <div class="empty-icon">◈</div>
              <div class="empty-text">// 开始输入以启动对话</div>
            </div>
          </div>
        </div>

        <div class="composer-area">
          <div class="composer">
            <textarea id="messageInput" placeholder="输入指令或问题…" rows="1"></textarea>
            <button class="send-btn" id="sendBtn" title="发送 (Enter)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
              </svg>
            </button>
          </div>
          <div class="composer-hint">↵ Enter 发送 · Shift+Enter 换行</div>
        </div>
      </div>

      <!-- TREE PANEL (desktop: right side, mobile: bottom drawer) -->
      <aside class="tree-panel" id="treePanel" aria-label="分支树状图" aria-hidden="true">
        <div class="tree-panel-resize" id="treePanelResize" aria-hidden="true"></div>
        <div class="tree-panel-header">
          <span class="tree-panel-title">// Branch Tree</span>
          <button class="tree-panel-close" id="treePanelClose" type="button" aria-label="关闭分支树面板">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
        <div class="tree-panel-body" id="treePanelBody">
          <div class="tree-panel-empty">
            <span>// 暂无分支数据</span>
          </div>
        </div>
      </aside>
    </div>
  </main>
</div>

<div class="modal-backdrop" id="userAdminModal" aria-hidden="true">
  <div class="skill-modal user-admin-modal" role="dialog" aria-modal="true" aria-labelledby="userAdminModalTitle">
    <div class="modal-head">
      <div class="modal-title" id="userAdminModalTitle">用户管理</div>
      <button class="modal-close" id="userAdminModalClose" type="button" aria-label="关闭">×</button>
    </div>
    <div class="admin-user-layout">
      <div class="user-list" id="userList"></div>
      <form class="skill-form user-form" id="userForm">
        <input id="userIdInput" type="hidden" />
        <label class="field-label">
          用户名
          <input class="skill-input" id="userUsernameInput" autocomplete="off" />
        </label>
        <label class="field-label">
          显示名称
          <input class="skill-input" id="userDisplayNameInput" autocomplete="off" />
        </label>
        <label class="field-label">
          密码
          <input class="skill-input" id="userPasswordInput" type="password" autocomplete="new-password" placeholder="编辑用户时留空则不修改" />
        </label>
        <div class="form-grid">
          <label class="field-label">
            角色
            <select class="skill-input" id="userRoleInput">
              <option value="user">普通用户</option>
              <option value="admin">管理员</option>
            </select>
          </label>
          <label class="field-label">
            状态
            <select class="skill-input" id="userStatusInput">
              <option value="active">启用</option>
              <option value="disabled">禁用</option>
            </select>
          </label>
        </div>
        <div class="skill-form-error" id="userFormError"></div>
        <div class="modal-actions">
          <button class="modal-secondary" id="userFormResetBtn" type="button">新建</button>
          <button class="modal-secondary danger-action" id="userDeleteBtn" type="button">删除</button>
          <button class="modal-secondary" id="userAdminCancelBtn" type="button">关闭</button>
          <button class="modal-primary" id="userSaveBtn" type="submit">保存</button>
        </div>
      </form>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="shareModal" aria-hidden="true">
  <div class="skill-modal" role="dialog" aria-modal="true" aria-labelledby="shareModalTitle">
    <div class="modal-head">
      <div class="modal-title" id="shareModalTitle">共享设置</div>
      <button class="modal-close" id="shareModalClose" type="button" aria-label="关闭">×</button>
    </div>
    <form class="skill-form" id="shareForm">
      <label class="field-label">
        范围
        <select class="skill-input" id="shareScopeInput">
          <option value="private">私有</option>
          <option value="all">共享给所有人</option>
          <option value="selected">共享给指定用户</option>
        </select>
      </label>
      <label class="field-label">
        权限
        <select class="skill-input" id="sharePermissionInput">
          <option value="write">可协作编辑</option>
          <option value="read">仅查看</option>
        </select>
      </label>
      <div class="field-label">
        指定用户
        <div class="share-user-list" id="shareUserList"></div>
      </div>
      <div class="skill-form-error" id="shareFormError"></div>
      <div class="modal-actions">
        <button class="modal-secondary" id="shareCancelBtn" type="button">取消</button>
        <button class="modal-primary" id="shareSaveBtn" type="submit">保存</button>
      </div>
    </form>
  </div>
</div>

<div class="modal-backdrop" id="configModal" aria-hidden="true">
  <div class="skill-modal" role="dialog" aria-modal="true" aria-labelledby="configModalTitle">
    <div class="modal-head">
      <div class="modal-title" id="configModalTitle">模型设置</div>
      <button class="modal-close" id="configModalClose" type="button" aria-label="关闭">×</button>
    </div>
    <form class="skill-form" id="configForm">
      <div class="config-summary" id="configSummary">
        <span>API URL</span><span>-</span>
        <span>API KEY</span><span>-</span>
        <span>模型</span><span>-</span>
      </div>
      <label class="field-label">
        API URL
        <input class="skill-input" id="configBaseUrlInput" name="base_url" autocomplete="off" placeholder="https://dashscope.aliyuncs.com/compatible-mode/v1" />
      </label>
      <label class="field-label">
        API KEY
        <input class="skill-input" id="configApiKeyInput" name="api_key" type="password" autocomplete="new-password" placeholder="留空则保留当前密钥" />
      </label>
      <label class="field-label">
        模型名称
        <input class="skill-input" id="configModelInput" name="model" autocomplete="off" placeholder="qwen-plus" />
      </label>
      <div class="skill-form-error" id="configFormError"></div>
      <div class="modal-actions">
        <button class="modal-secondary" id="configCancelBtn" type="button">取消</button>
        <button class="modal-primary" id="configSaveBtn" type="submit">保存</button>
      </div>
    </form>
  </div>
</div>

<div class="modal-backdrop" id="skillModal" aria-hidden="true">
  <div class="skill-modal" role="dialog" aria-modal="true" aria-labelledby="skillModalTitle">
    <div class="modal-head">
      <div class="modal-title" id="skillModalTitle">添加技能</div>
      <button class="modal-close" id="skillModalClose" type="button" aria-label="关闭">×</button>
    </div>
    <form class="skill-form" id="skillForm">
      <label class="field-label">
        技能名
        <input class="skill-input" id="skillNameInput" name="name" autocomplete="off" placeholder="calculator_ext" />
      </label>
      <label class="field-label">
        Markdown 内容
        <textarea class="skill-textarea" id="skillContentInput" name="content" spellcheck="false" placeholder="# 技能说明&#10;描述这个技能的使用规则、输出格式和注意事项。"></textarea>
      </label>
      <div class="skill-form-error" id="skillFormError"></div>
      <div class="modal-actions">
        <button class="modal-secondary" id="skillCancelBtn" type="button">取消</button>
        <button class="modal-primary" id="skillSaveBtn" type="submit">保存</button>
      </div>
    </form>
  </div>
</div>

<script type="module" src="/js/app.js?v=2"></script>
</body>
</html>
